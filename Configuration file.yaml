# =====================
# 分流规则
# =====================

rules:

  # ---- 局域网/内网直连 ----
   - IP-CIDR,127.0.0.0/8,DIRECT
   - IP-CIDR,192.168.0.0/16,DIRECT
   - IP-CIDR,10.0.0.0/8,DIRECT
   - IP-CIDR,172.16.0.0/12,DIRECT

  # ---- 广告拦截 ----
   - RULE-SET,reject,REJECT
   - RULE-SET,anti-ad,REJECT

  # ---- 社媒（正则，优先住宅IP） ----
   - DOMAIN-REGEX,(.*\.)?(tiktok|facebook|instagram|linkedin).*,🇭🇰 香港前置

  # ---- Google 全家桶（含 Play/Gmail/搜索/API 等，一条 keyword 覆盖绝大部分） ----
   - DOMAIN-KEYWORD,google,🇭🇰 香港前置

  # 不含 "google" 字样、需要单独列出的 Google 相关域名/CDN
   - DOMAIN-SUFFIX,gstatic.com,🇭🇰 香港前置
   - DOMAIN-SUFFIX,gvt1.com,🇭🇰 香港前置
   - DOMAIN-SUFFIX,gvt2.com,🇭🇰 香港前置
   - DOMAIN-SUFFIX,gvt3.com,🇭🇰 香港前置
   - DOMAIN-SUFFIX,gvt1-cn.com,🇭🇰 香港前置
   - DOMAIN-SUFFIX,gvt2-cn.com,🇭🇰 香港前置
   - DOMAIN-SUFFIX,gvt1.net,🇭🇰 香港前置
   - DOMAIN-SUFFIX,gvt2.net,🇭🇰 香港前置

  # Google CDN IP 段（域名规则命中不了 IP，需单独保留）
   - IP-CIDR,142.250.0.0/15,🇭🇰 香港前置,no-resolve
   - IP-CIDR,172.217.0.0/16,🇭🇰 香港前置,no-resolve
   - IP-CIDR,216.58.192.0/19,🇭🇰 香港前置,no-resolve
   - IP-CIDR,74.125.0.0/16,🇭🇰 香港前置,no-resolve
   - IP-CIDR,173.194.0.0/16,🇭🇰 香港前置,no-resolve

  # Google Play / Android 更新（本机运行 Clash 时才生效，路由器/多设备场景下无效，靠上面的域名规则兜底）
   - PROCESS-NAME,com.android.vending,🇭🇰 香港前置
   - PROCESS-NAME,com.google.android.gms,🇭🇰 香港前置
   - PROCESS-NAME,com.google.android.gsf,🇭🇰 香港前置
   - PROCESS-NAME,com.android.providers.downloads,🇭🇰 香港前置

  # ---- YouTube ----
   - DOMAIN-SUFFIX,youtube.com,🇭🇰 香港前置
   - DOMAIN-SUFFIX,youtu.be,🇭🇰 香港前置
   - DOMAIN-SUFFIX,ytimg.com,🇭🇰 香港前置

  # ---- AI ----
   - DOMAIN-SUFFIX,openai.com,🇭🇰 香港前置
   - DOMAIN-SUFFIX,chatgpt.com,🇭🇰 香港前置
